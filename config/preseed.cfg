### Lokalisatie (Taal en Regio)
d-i debian-installer/locale string nl_NL.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i keyboard-configuration/variant select altgr-intl

### Netwerkconfiguratie
# Configureert automatisch via DHCP
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string budget-assistant
d-i netcfg/get_domain string local

### Spiegelservers (Mirror) voor pakketten
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### Account instellen (Root en Gebruiker)
# Root-account uitschakelen (veiligheid), sudo wordt gebruikt
d-i passwd/root-login boolean false

# Maak een standaard beheerder aan (Pas 'assistant' en het wachtwoord aan indien gewenst!)
d-i passwd/user-fullname string Assistant Admin
d-i passwd/username string assistant
d-i passwd/user-password password Welkom01
d-i passwd/user-password-again password Welkom01

### Klok en Tijdzone
d-i clock-setup/utc boolean true
d-i time/zone string Europe/Amsterdam
d-i clock-setup/ntp boolean true

### Partitionering (LET OP: Dit wist de EERSTE schijf volledig!)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nochanges boolean true

### Pakketselectie (Houd het SUPER licht)
tasksel tasksel/first multiselect standard, ssh-server
# Voeg extra basispakketten toe die handig zijn voor Docker/Home Assistant
d-i pkgsel/include string sudo curl git htop
d-i pkgsel/upgrade select safe-upgrade

### Bootloader installeren (GRUB)
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean true
d-i grub-installer/bootdev string default

### Afronding en Herstart
# Zorgt dat de pc na installatie herstart en de ISO negeert
d-i finish-install/reboot_in_progress note
